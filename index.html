<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Turnos del club · Órbita de Ideas</title><link rel="stylesheet" href="style.css"></head><body><header class="cabecera"><p>ÓRBITA DE IDEAS</p><h1>Reservá tu espacio de estudio.</h1><p>Elegí una sala, un horario y el objetivo del encuentro.</p></header><main class="layout">
<section class="panel formulario-panel" aria-labelledby="titulo-form"><h2 id="titulo-form">Nuevo turno</h2><form id="form-turno"><label for="nombre">Nombre<input id="nombre" autocomplete="name" required></label><label for="fecha">Fecha<input id="fecha" type="date" required></label><div class="horarios"><label for="inicio">Inicio<input id="inicio" type="time" required></label><label for="fin">Fin<input id="fin" type="time" required></label></div><label for="recurso">Sala<select id="recurso"><option>Sala Andrómeda</option><option>Sala Eclipse</option><option>Sala Nova</option></select></label><label for="motivo">Motivo o materia<textarea id="motivo" rows="3" required></textarea></label><button type="submit">Confirmar turno</button></form><p id="mensaje" role="alert"></p></section>
<section class="columna"><section class="panel agenda-panel" aria-labelledby="titulo-agenda"><h2 id="titulo-agenda">Agenda</h2><div id="agenda"></div></section><section class="panel comprobante" id="comprobante" aria-labelledby="titulo-comprobante" hidden><h2 id="titulo-comprobante">Comprobante</h2><div id="comprobante-datos"></div><button type="button" id="imprimir">Imprimir comprobante</button></section></section>
</main><script src="script.js"></script></body></html>
